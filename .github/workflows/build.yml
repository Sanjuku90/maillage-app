name: Build Android

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sign_release:
        description: 'Signer l’APK release avec les secrets Android configurés'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Installer la plateforme et les outils Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Installer Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler et tester
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:assembleRelease
      - name: Vérifier la signature de test et préparer les fichiers
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          test -s "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p output-android
          cp "$APK" output-android/Maillage-Android-test.apk
          cp "$UNSIGNED" output-android/Maillage-Android-release-non-signe.apk
          printf 'Commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > output-android/BUILD-INFO.txt
          (cd output-android && sha256sum *.apk > SHA256SUMS.txt)
      - name: Analyse lint Android (rapport, non bloquant)
        id: lint
        continue-on-error: true
        run: gradle --no-daemon --stacktrace :app:lintDebug
      - name: Résumé
        if: always()
        shell: bash
        run: |
          echo '## Android' >> "$GITHUB_STEP_SUMMARY"
          echo 'APK de test signé avec une clé de debug; release non signée.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Résultat lint : ${{ steps.lint.outcome }}. Voir les rapports et corriger les erreurs avant diffusion.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publier les APK de build
        uses: actions/upload-artifact@v4
        with:
          name: Maillage-Android-${{ github.sha }}
          path: output-android/
          if-no-files-found: error
          retention-days: 14
      - name: Publier les rapports de tests et lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Maillage-Android-rapports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_release
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Vérifier les secrets et créer le keystore temporaire
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo 'Secrets de signature manquants : voir BUILD-GITHUB-ACTIONS.md.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/maillage-release.jks"
          test -s "$RUNNER_TEMP/maillage-release.jks"
      - name: Compiler et signer l’APK release
        shell: bash
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export ANDROID_STORE_FILE="$RUNNER_TEMP/maillage-release.jks"
          gradle --no-daemon --stacktrace :app:assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p output-signed
          cp "$APK" output-signed/Maillage-Android-release-signe.apk
          printf 'Commit: %s\nWorkflow run: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > output-signed/BUILD-INFO.txt
          (cd output-signed && sha256sum *.apk > SHA256SUMS.txt)
      - name: Effacer le keystore temporaire
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/maillage-release.jks"
      - name: Publier l’APK signé
        uses: actions/upload-artifact@v4
        with:
          name: Maillage-Android-release-signe-${{ github.sha }}
          path: output-signed/
          if-no-files-found: error
          retention-days: 14
