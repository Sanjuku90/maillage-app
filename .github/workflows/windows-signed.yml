name: Build Windows signé

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Java pour les tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Installer les dépendances
        run: |
          python -m pip install -r desktop/requirements.txt
          python -m pip install pyinstaller==6.16.0
          python -m pip check
          python -c "import argon2, bleak, coincurve, cryptography, python_socks, websocket, tkinter, shutil; assert shutil.which('javac'), 'JDK compiler missing'"
      - name: Tests unitaires
        working-directory: desktop
        run: python -m unittest discover -s tests -v
      - name: Construire le programme Windows
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --collect-submodules bleak --name Maillage-PC main.py
      - name: Signer et vérifier l’exécutable
        shell: pwsh
        env:
          WINDOWS_CODE_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGNING_PFX_BASE64 }}
          WINDOWS_CODE_SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_PASSWORD }}
        run: ./scripts/sign-windows.ps1 -Executable 'desktop/dist/Maillage-PC/Maillage-PC.exe'
      - name: Tester l’exécutable signé sans réseau
        run: python scripts/smoke_desktop.py desktop/dist/Maillage-PC/Maillage-PC.exe
      - name: Archiver et calculer SHA-256
        run: python scripts/package_desktop.py Windows desktop/dist/Maillage-PC output-desktop
      - name: Enregistrer le commit et les dépendances
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA`nWorkflow run: $env:GITHUB_RUN_ID`nExecutable: signé et horodaté`n" | Out-File -FilePath output-desktop/BUILD-INFO.txt -Encoding utf8
          python -m pip freeze | Out-File -FilePath output-desktop/DEPENDENCIES.txt -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de lister les dépendances' }
      - name: Publier le programme signé
        uses: actions/upload-artifact@v4
        with:
          name: Maillage-PC-Windows-signe-${{ github.sha }}
          path: output-desktop/
          if-no-files-found: error
          retention-days: 14
      - name: Résumé
        shell: pwsh
        run: |
          '## Programme Windows signé' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          'Le fichier .exe a été signé et vérifié. Les autres composants du dossier ne sont pas nécessairement signés. Un avertissement SmartScreen reste possible.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
