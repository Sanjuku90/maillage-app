name: Préparer MSIX Microsoft Store

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: 'Package/Identity/Name attribué par Partner Center'
        required: true
        type: string
      publisher:
        description: 'Package/Identity/Publisher attribué par Partner Center (CN=...)'
        required: true
        type: string
      display_name:
        description: 'Nom d’application réservé dans Partner Center'
        required: true
        type: string
      publisher_display:
        description: 'Package/Properties/PublisherDisplayName de Partner Center'
        required: true
        type: string
      version:
        description: 'Version du paquet, par exemple 1.0.0.0 (dernier nombre 0)'
        required: true
        type: string
        default: '1.0.0.0'

permissions:
  contents: read

jobs:
  store-package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Java pour les tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.11'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - name: Installer les dépendances
        run: |
          python -m pip install -r desktop/requirements.txt
          python -m pip install pyinstaller==6.16.0
          python -m pip check
          python -c "import argon2, bleak, coincurve, cryptography, python_socks, websocket, tkinter, shutil; assert shutil.which('javac'), 'JDK compiler missing'"
      - name: Exécuter les tests unitaires
        working-directory: desktop
        run: python -m unittest discover -s tests -v
      - name: Construire le programme Windows
        working-directory: desktop
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --collect-submodules bleak --name Maillage-PC main.py
      - name: Tester le programme sans réseau
        run: python scripts/smoke_desktop.py desktop/dist/Maillage-PC/Maillage-PC.exe
      - name: Préparer le contenu MSIX
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_DISPLAY_NAME: ${{ inputs.display_name }}
          STORE_PUBLISHER_DISPLAY: ${{ inputs.publisher_display }}
          STORE_VERSION: ${{ inputs.version }}
        run: |
          python scripts/prepare_msix.py --source desktop/dist/Maillage-PC --stage msix-stage `
            --identity-name "$env:STORE_IDENTITY_NAME" --publisher "$env:STORE_PUBLISHER" `
            --display-name "$env:STORE_DISPLAY_NAME" --publisher-display "$env:STORE_PUBLISHER_DISPLAY" `
            --version "$env:STORE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Préparation MSIX échouée' }
      - name: Créer et vérifier le paquet MSIX non signé
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $versions = Get-ChildItem -LiteralPath $root -Directory | Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } | Sort-Object { [version]$_.Name } -Descending
          $makeappx = $null
          foreach ($version in $versions) {
            $candidate = Join-Path $version.FullName 'x64\makeappx.exe'
            if (Test-Path -LiteralPath $candidate -PathType Leaf) { $makeappx = $candidate; break }
          }
          if ($null -eq $makeappx) { throw 'MakeAppx.exe introuvable dans le SDK Windows.' }
          New-Item -ItemType Directory -Path output-store -Force | Out-Null
          & $makeappx pack /o /d msix-stage /p output-store/Maillage-Store-non-signe.msix
          if ($LASTEXITCODE -ne 0) { throw 'Création MSIX échouée.' }
          & $makeappx unpack /o /p output-store/Maillage-Store-non-signe.msix /d msix-verification
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'msix-verification/AppxManifest.xml') -or -not (Test-Path 'msix-verification/app/Maillage-PC.exe')) { throw 'Vérification de l’archive MSIX échouée.' }
          $hash = (Get-FileHash -Algorithm SHA256 output-store/Maillage-Store-non-signe.msix).Hash.ToLower()
          "$hash  Maillage-Store-non-signe.msix" | Out-File output-store/SHA256SUMS.txt -Encoding ascii
          "Commit: $env:GITHUB_SHA`nWorkflow run: $env:GITHUB_RUN_ID`nNon signé : destiné à une soumission Microsoft Store`n" | Out-File output-store/BUILD-INFO.txt -Encoding utf8
      - name: Publier le paquet non signé pour préparation
        uses: actions/upload-artifact@v4
        with:
          name: Maillage-MSIX-Store-non-signe-${{ github.sha }}
          path: output-store/
          if-no-files-found: error
          retention-days: 14
      - name: Résumé
        shell: pwsh
        run: |
          '## Préparation Microsoft Store' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          'Paquet non signé : il ne devient signé par Microsoft qu’après soumission et certification réussie. Ce workflow ne publie rien.' | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
